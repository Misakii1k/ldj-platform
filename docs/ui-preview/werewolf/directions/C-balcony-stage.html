<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>狼人杀 · C 楼座与大舞台</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* 楼座：所有人坐在舞台上方的一排（手机两排）楼座包厢里，下面整块都是舞台 */
  .balcony {
    position: absolute; z-index: 6; display: grid; gap: 10px; padding: 14px 14px 22px;
    background: linear-gradient(180deg, #2c0f16, #1c080d);
    border-radius: 16px 16px 40px 40px / 16px 16px 26px 26px;
    border: 1px solid rgba(232, 194, 122, .28);
    box-shadow: 0 14px 30px #000a;
  }
  /* 楼座前沿的金色栏杆 */
  .balcony::after {
    content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 8px; border-radius: 4px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 3px, transparent 3px 14px), linear-gradient(var(--gold), var(--gold)) 0 0 / 100% 2px no-repeat;
    opacity: .7;
  }
  .balcony .seat.compact .name { font-size: 12.5px; }
  /* 发言者：大立绘 + 左右排版 */
  .big-stage .speaker { grid-template-columns: auto auto; column-gap: 34px; align-items: center; justify-content: center; text-align: left; }
  .big-stage .speaker .portrait { grid-row: 1 / span 4; margin: 0; }
  .big-stage .speaker .kicker { align-self: end; }
  .big-stage .speaker [data-timer] { justify-self: start; }
  .device[data-size="mobile"].big-stage .speaker { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .device[data-size="mobile"].big-stage .speaker .portrait { grid-row: auto; margin: 8px 0 6px; }
  .device[data-size="mobile"].big-stage .speaker [data-timer] { justify-self: center; }
  /* 发言顺序条：舞台脚下，一眼看出轮到谁、下一个是谁 */
  .order {
    position: absolute; z-index: 7; display: flex; justify-content: center; align-items: center; gap: 6px;
    transition: opacity 500ms;
  }
  .order span {
    min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px;
    font: 700 14px/1 var(--serif); color: var(--muted); border: 1px solid rgba(232, 194, 122, .25); background: rgba(0, 0, 0, .35);
  }
  .order span.done { opacity: .45; text-decoration: line-through; }
  .order span.now { color: var(--cta-ink); background: var(--gold); border-color: var(--gold); transform: scale(1.18); }
  .order span.dead { opacity: .3; }
  .order i { color: var(--dim); font-style: normal; font-size: 11px; }
  body[data-time="night"] .order { opacity: 0; }
  .device[data-size="mobile"] .speaker .kicker { font-size: 11px; }
  .device[data-size="mobile"] .speaker .sub { font-size: 12px; }
  .device[data-size="mobile"] .speaker .sub b { font-size: 14px; }
  .device[data-size="mobile"] .dock { flex-wrap: wrap; }
  .device[data-size="mobile"] .dock .info { flex: 1 0 100%; }
  .device[data-size="mobile"] .dock .btn { flex: 1; }
  .device[data-size="mobile"] .night-title h2 { font-size: 36px; }
  .device[data-size="mobile"] .topbar .game { font-size: 16px; }
  .device[data-size="mobile"] .topbar .day { font-size: 13px; padding: 2px 10px; }
  .device[data-size="mobile"] .icon-btn { width: 32px; height: 32px; }
  .device[data-size="mobile"] .order span { min-width: 22px; height: 22px; font-size: 11px; padding: 0 3px; }
  .device[data-size="mobile"] .order { gap: 3px; }
</style>
</head>
<body data-time="day">
<div class="toolbar">
  <strong>C · 楼座与大舞台</strong>
  <span class="note">对标：Balatro 的"主角牌占满中央"｜ 全员坐进顶部楼座，下面整块都是舞台，发言者立绘放到最大，脚下一条发言顺序 ｜ 与 A/B 的差别：舞台最大、最有戏剧感，席位最小</span>
  <div class="group"><button data-set-size="desktop">桌面 1280×800</button><button data-set-size="mobile">手机 390×844</button></div>
  <div class="group"><button data-set-count="9">9 人</button><button data-set-count="12">12 人</button></div>
  <div class="group"><button data-set-time="day">白天 ☀</button><button data-set-time="night">入夜 🌙</button></div>
  <div class="group"><button id="pass" class="hit">交麦（看飞行）</button><button id="last10">跳到最后 10 秒</button><button id="reset">重播</button></div>
</div>
<div class="stage-wrap"><div class="scaler"><div class="device"></div></div></div>
<script>
window.LAYOUT = function ({ size, count, players, makeSeat, device }) {
  const W = window.WW;
  W.reset(device);
  device.classList.add('big-stage');
  const desk = size === 'desktop';

  let order;
  if (desk) {
    W.buildTopbar(device, { x: 28, y: 16, w: 1224 });
    const bal = W.place(W.add(device, 'balcony'), 24, 62, 1232, 128);
    bal.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;
    players.forEach((p) => bal.appendChild(makeSeat(p, true)));
    W.buildStage(device, { x: 60, y: 212, w: 1160, h: 430, floorH: 50, spotW: 560 });
    W.buildSpeaker(device, { x: 60, y: 300, w: 1160, portrait: 190, font: 64, timerR: 36, timerGap: 12 });
    order = W.place(W.add(device, 'order'), 60, 610, 1160);
    W.buildNight(device, 330);
    W.buildDock(device, { x: 24, y: 712, w: 1232, h: 70 });
  } else {
    W.buildTopbar(device, { x: 16, y: 16, w: 358 }, true);
    const perRow = Math.ceil(count / 2);
    const bal = W.place(W.add(device, 'balcony'), 8, 62, 374, 250);
    bal.style.gridTemplateColumns = `repeat(${perRow}, minmax(0, 1fr))`;
    bal.style.padding = '12px 8px 22px';
    bal.style.rowGap = '14px';
    players.forEach((p) => bal.appendChild(makeSeat(p, true)));
    W.buildStage(device, { x: 20, y: 330, w: 350, h: 320, floorH: 36, spotW: 220 });
    W.buildSpeaker(device, { x: 20, y: 372, w: 350, portrait: 100, font: 32, timerR: 24, timerGap: 8 });
    order = W.place(W.add(device, 'order'), 20, 624, 350);
    W.buildNight(device, 400);
    W.buildDock(device, { x: 16, y: 700, w: 358, h: 124 });
  }

  // 发言顺序条随席位状态刷新
  const paintOrder = () => {
    order.innerHTML = '';
    for (const el of device.querySelectorAll('.seat')) {
      const s = document.createElement('span');
      s.textContent = el.dataset.no;
      if (el.classList.contains('is-dead')) s.className = 'dead';
      else if (el.classList.contains('is-speaking')) s.className = 'now';
      else if (el.querySelector('.tag').textContent === '已发言') s.className = 'done';
      order.appendChild(s);
    }
  };
  new MutationObserver(paintOrder).observe(device, { subtree: true, attributes: true, attributeFilter: ['class'] });
  setTimeout(paintOrder, 0);
};
</script>
<script src="_shared.js"></script>
</body>
</html>
