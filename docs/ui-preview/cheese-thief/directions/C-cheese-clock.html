<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奶酪大盗 · 方向 C · 奶酪钟</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* 方向 C：一面巨大的"奶酪钟"就是舞台，6 个席位按座位号绕钟一圈（不按骰点排，骰点只有本人可见）；夜色最浓（饱和的绘本深蓝紫，但仍是明亮插画而非黑夜） */
  .device { background: radial-gradient(ellipse at 50% 46%, #8e8ee6 0%, #6a64c9 55%, #5a4fb5 100%); }
  [data-time="day"] .device { background: radial-gradient(ellipse at 50% 46%, #fff3c4 0%, #ffd976 55%, #ffc24d 100%); }
  .device::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(#fff7d6 1.4px, transparent 1.6px), radial-gradient(#fff7d6 1px, transparent 1.2px);
    background-size: 90px 90px, 53px 53px; background-position: 10px 20px, 30px 5px; opacity: .55;
  }
  [data-time="day"] .device::before { opacity: 0; }

  .head {
    position: absolute; top: 24px; left: 32px; padding: 10px 18px; background: var(--cream);
    border: var(--border); border-radius: 16px; box-shadow: var(--shadow-sm);
  }
  .head .title { font-size: 30px; }

  .clock {
    --R: 230px;
    position: absolute; left: 50%; top: 44%; width: calc(var(--R) * 2); height: calc(var(--R) * 2);
    translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, #ffe8a3 0 38%, #f7c84b 39% 100%);
    border: var(--border); box-shadow: 0 10px 0 var(--ink);
  }
  .clock .hole { position: absolute; border-radius: 50%; background: #e0a92a; }
  .clock .num {
    position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px;
    display: grid; place-items: center; font: 700 22px var(--serif); background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 50%; box-shadow: 0 2px 0 var(--ink);
    --a: calc(var(--h) * 60deg - 90deg);
    transform: translate(calc(cos(var(--a)) * var(--R) * .6), calc(sin(var(--a)) * var(--R) * .6));
  }
  .clock .num.now { background: var(--ink); color: var(--yellow); scale: 1.2; }
  .hand {
    position: absolute; left: 50%; top: 50%; width: 10px; height: calc(var(--R) * .52); margin-left: -5px;
    background: var(--ink); border-radius: 6px; transform-origin: 50% 0; rotate: calc(3 * 60deg + 180deg);
    transition: rotate 700ms cubic-bezier(.34,1.56,.64,1);
  }
  .hand::after { content: ""; position: absolute; left: 50%; bottom: -14px; translate: -50% 0; border: 12px solid transparent; border-top: 18px solid var(--ink); }
  [data-time="day"] .hand { rotate: calc(0deg + 180deg); }

  .core {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 150px; z-index: 2;
    display: grid; justify-items: center; gap: 2px;
  }
  .core .cheese-box { width: 120px; position: relative; }
  .core .caption { font: 800 12px var(--sans); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; box-shadow: 0 2px 0 var(--ink); white-space: nowrap; }

  .dial { position: absolute; inset: 0; pointer-events: none; }
  .dial .seat {
    position: absolute; pointer-events: auto; width: 116px;
    --a: calc(var(--i) * 60deg - 60deg);
    left: calc(50% + cos(var(--a)) * 455px); top: calc(44% + sin(var(--a)) * 290px); translate: -50% -50%;
  }

  .dock { position: absolute; left: 50%; bottom: 20px; translate: -50% 0; width: min(760px, calc(100% - 48px)); }

  @container (max-width: 600px) {
    .head { top: 14px; left: 14px; right: 14px; padding: 8px 12px; }
    .head .title { font-size: 22px; }
    .clock { --R: 94px; top: 43%; }
    .clock .num { width: 30px; height: 30px; margin: -15px; font-size: 15px; }
    .hand { width: 7px; margin-left: -3.5px; }
    .core { width: 100px; }
    .core .cheese-box { width: 70px; }
    .core .caption { font-size: 10px; padding: 2px 6px; }
    .dial .seat { width: 80px; padding: 6px 4px; left: calc(50% + cos(var(--a)) * 150px); top: calc(43% + sin(var(--a)) * 215px); }
    .seat .mouse-box { width: 36px; }
    .seat-name { font-size: 12px; }
    .die, .cup { transform: scale(.8); }
    .dock { left: 12px; right: 12px; bottom: 12px; width: auto; translate: none; padding: 10px 12px; flex-wrap: wrap; }
    .dock .actions { width: 100%; }
    .dock .actions .btn, .dock .day-only { flex: 1; }
  }
</style>
</head>
<body data-time="night">
<div class="toolbar">
  <strong>方向 C · 奶酪钟</strong>
  <span class="note">构图：一面巨大的奶酪钟就是舞台，指针走到几点就是几点，席位按座位号绕钟一圈　夜色：最浓的绘本蓝紫　对标：Balatro 的"道具即界面"</span>
  <div class="group"><button data-set-size="desktop" aria-pressed="true">桌面 1280×800</button><button data-set-size="mobile" aria-pressed="false">手机 390×844</button></div>
  <div class="group"><button data-set-time="night" aria-pressed="true">夜晚</button><button data-set-time="day" aria-pressed="false">天亮 ☀</button></div>
  <div class="group"><button id="reset">重播</button></div>
</div>
<div class="stage-wrap"><div class="device" data-size="desktop">
  <div class="head" data-box="head">
    <div class="eyebrow" data-night="NIGHT · 第 3 点" data-day="MORNING · 天亮了"></div>
    <h1 class="title" data-night="你独自醒来了" data-day="奶酪还在吗？" data-after-steal="奶酪到手，别出声"></h1>
  </div>

  <div class="clock" data-box="clock">
    <span class="hole" style="left:16%;top:30%;width:34px;height:34px"></span>
    <span class="hole" style="left:72%;top:20%;width:22px;height:22px"></span>
    <span class="hole" style="left:78%;top:66%;width:40px;height:40px"></span>
    <span class="hole" style="left:26%;top:74%;width:26px;height:26px"></span>
    <span class="num" style="--h:1">1</span><span class="num" style="--h:2">2</span><span class="num now" style="--h:3">3</span>
    <span class="num" style="--h:4">4</span><span class="num" style="--h:5">5</span><span class="num" style="--h:6">6</span>
    <div class="hand"></div>
    <div class="core">
      <div class="cheese-box">
        <svg id="cheese" class="cheese" viewBox="0 0 160 110" aria-label="奶酪"><path d="M8 96 L152 96 L152 52 L26 14 Z" fill="#fffdf7" stroke="#292722" stroke-width="5" stroke-linejoin="round"/><path d="M26 14 L152 52 L152 60 L22 22 Z" fill="#fff4df"/><circle cx="60" cy="72" r="9" fill="#f7c84b"/><circle cx="104" cy="80" r="6" fill="#f7c84b"/><circle cx="126" cy="66" r="5" fill="#f7c84b"/></svg>
        <div class="crumbs">· · ·</div>
      </div>
      <span class="caption" data-night="奶酪还在钟心" data-day="钟敲六下，天亮了" data-after-steal="钟心空了"></span>
    </div>
  </div>

  <div class="dial" data-seats="0-5"></div>

  <div class="dock" data-box="dock">
    <div class="info">
      <strong data-night="只有你在 3 点醒着" data-day="讨论 2:00 · 谁在夜里醒过？"></strong>
      <span data-night="可以偷走奶酪，或偷看一位玩家的骰子。只有你看得到。" data-day="说出你醒来的时刻和看到的东西，可以撒谎。"></span>
    </div>
    <div class="actions">
      <button id="act-steal" class="btn btn-primary">偷走奶酪</button>
      <button id="act-peek" class="btn" aria-pressed="false">偷看骰子</button>
    </div>
    <button class="btn btn-primary day-only">去投票指认</button>
  </div>

  <div class="sweep"></div>
</div></div>
<script src="_shared.js"></script>
</body>
</html>
