<!doctype html>

</div>

  <div class="beams"><b></b><i></i><i></i></div>
  <div class="floor"></div>

        <path d="M44 60 Q70 46 104 44" stroke="#fff8d8" stroke-width="5" stroke-linecap="round" fill="none"/>

    </div>
    <div class="board"></div>

    </div>

      <button id="act-peek" class="btn" aria-pressed="false">偷看骰子</button>
      <button id="act-steal" class="btn btn-primary">偷走奶酪</button>
    </div>
    <button class="btn btn-primary day-only">去投票</button>
  </div>

  <div class="sweep"></div>
</div></div>

</html>
