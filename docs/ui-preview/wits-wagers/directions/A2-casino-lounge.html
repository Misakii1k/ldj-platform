<style>
/* =========================================================
   A2 深夜赌场贵宾厅 · 修订稿（对照 A-casino-lounge.html）
   保留：吊灯 + 绿毡氛围、左右围坐、手机顶部 3×2 席位（用户 2026-09-26 确认）。
   本轮只改三处：① 牌和筹码更精致 ② 席位卡 ③ 揭晓结算更有分量。
   ========================================================= */
.device {
  --felt: #0f3b2c; --felt-2: #0a2a1f; --brass: #c9a45c; --brass-hi: #ecd08e; --brass-dim: rgba(201,164,92,.45);

  background: #07100c; color: var(--txt); --ring-bg: #0b1a14;
}

/* ---------- 场景（与 A 相同，不在本轮修改范围） ---------- */
.decor { position: absolute; inset: 0; pointer-events: none; }
.decor .room { position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 64px), radial-gradient(90% 70% at 50% 40%, #16261f 0%, #070d0a 70%);
}
.decor .lamp { position: absolute; left: 50%; top: -30px; width: 280px; height: 70px; transform: translateX(-50%);
  background: linear-gradient(#1f4a36, #0d2a1e); border-radius: 0 0 140px 140px / 0 0 60px 60px;
  border-bottom: 2px solid var(--brass); box-shadow: 0 16px 50px rgba(255,220,140,.35);
}
.decor .cone { position: absolute; left: 50%; top: 30px; width: 1100px; height: 760px; transform: translateX(-50%);
  background: radial-gradient(50% 55% at 50% 0%, rgba(255,226,160,.20), rgba(255,226,160,.06) 55%, transparent 75%);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
}

  background: radial-gradient(60% 55% at 50% 35%, #1b5a42 0%, var(--felt) 45%, var(--felt-2) 100%);
  box-shadow: 0 0 0 14px #2a1a10, 0 0 0 16px var(--brass-dim), 0 0 0 26px #1a0f09, 0 40px 80px rgba(0,0,0,.7), inset 0 0 90px rgba(0,0,0,.55);
}
.decor .table::after { content: "一 智 千 金 · 贵 宾 厅"; position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
  font: 600 15px/1 var(--serif); letter-spacing: .6em; color: rgba(201,164,92,.28); white-space: nowrap;
}
.decor .smoke { position: absolute; left: 20%; top: 120px; width: 60%; height: 200px; opacity: .5;
  background: radial-gradient(40% 50% at 30% 50%, rgba(255,255,255,.05), transparent), radial-gradient(35% 45% at 70% 40%, rgba(255,255,255,.04), transparent);
  animation: breathe 7s ease-in-out infinite;
}

.hud { position: absolute; left: 32px; right: 32px; top: 22px; display: flex; align-items: center; gap: 14px; z-index: 5; }
.hud .round { font-size: 14px; color: var(--muted); }
.hud .round b { font-size: 22px; color: var(--brass); }
.hud .phase { padding: 5px 14px; border: 1px solid var(--brass-dim); border-radius: 999px; font: 700 13px/1 var(--sans); letter-spacing: .2em; color: var(--brass); }
.hud .ring { margin-left: auto; --ring: var(--brass); }
.question { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); width: 760px; text-align: center; z-index: 4; }
.q-kicker { font: 600 13px/1 var(--sans); letter-spacing: .3em; color: var(--brass); }
.q-text { margin: 12px 0 6px; font: 700 40px/1.2 var(--serif); color: #fff6df; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
.q-unit { font-size: 14px; color: var(--muted); }

/* =========================================================
   ① 筹码：俯视圆筹码 + 厚度 + 边缘白色镶片 + 中心象牙嵌片
   ========================================================= */
.chip { --s: 34px; position: relative; flex: none; width: var(--s); height: var(--s); border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 58%, rgba(0,0,0,.18) 59% 61%, transparent 62%),
    repeating-conic-gradient(from 11deg, #fff8e8 0 16deg, transparent 16deg 45deg),
    var(--pc);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--pc) 70%, #000), 0 2px 0 color-mix(in srgb, var(--pc) 55%, #000), 0 3px 0 color-mix(in srgb, var(--pc) 45%, #000),
    0 5px 6px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.25);
}
.chip::before { content: ""; position: absolute; inset: 22%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fffaf0, var(--ivory-2)); box-shadow: 0 0 0 1.5px var(--pc), 0 0 0 2.5px rgba(0,0,0,.2);
}
.chip::after { content: attr(data-l); position: absolute; inset: 0; display: grid; place-items: center; font: 800 calc(var(--s) * .32)/1 var(--serif); color: var(--ink); }
.chip em { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 2; font: 800 10px/1 var(--sans); font-style: normal;
  color: #1a1408; background: linear-gradient(var(--brass-hi), var(--brass)); border-radius: 4px; padding: 2px 4px; box-shadow: 0 1px 0 rgba(0,0,0,.5); white-space: nowrap;
}

/* =========================================================
   ① 扑克牌：牌角索引 + 纸纹 + 金色内框 + 水印花色；背面酒红菱格 + 「智」字章
   ========================================================= */
.board { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); display: flex; gap: 14px; z-index: 4; perspective: 900px; }
.slot { position: relative; width: 118px; height: 236px; border: 1.5px solid var(--brass-dim); border-radius: 12px;
  display: grid; grid-template-rows: auto auto; justify-items: center; align-content: start; padding: 10px 8px; transition: filter 300ms, opacity 300ms;
  background: radial-gradient(80% 60% at 50% 40%, rgba(255,255,255,.03), transparent);
}
.odds { padding: 4px 10px 3px; border-radius: 6px; background: linear-gradient(var(--brass-hi), var(--brass) 60%, #9c7a3a); color: #1a1408;
  font: 800 16px/1 var(--serif); box-shadow: 0 2px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5); }
.odds small { font: 700 10px/1 var(--sans); margin-right: 3px; letter-spacing: .05em; }
.pcard { position: relative; margin-top: 10px; width: 94px; height: 132px; border-radius: 9px; color: var(--ink); display: grid; place-items: center; overflow: hidden;
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.7), transparent 60%),
    repeating-linear-gradient(115deg, rgba(120,90,40,.035) 0 2px, transparent 2px 5px),
    linear-gradient(var(--ivory), var(--ivory-2));
  box-shadow: 0 10px 18px rgba(0,0,0,.5), 0 1px 0 rgba(0,0,0,.3), inset 0 0 0 1px rgba(0,0,0,.1), inset 0 0 0 5px transparent, inset 0 0 0 6px rgba(168,128,60,.45);
}
.pcard::before { content: "♠"; position: absolute; font-size: 88px; line-height: 1; color: rgba(28,26,21,.05); }
.pcard .v { position: relative; font: 700 30px/1 var(--serif); letter-spacing: -.01em; }
.pcard .u { position: absolute; top: calc(50% + 22px); font-size: 11px; color: #7a6d55; }
.pcard .ix { position: absolute; display: grid; justify-items: center; font: 700 11px/1 var(--serif); color: #5a4a2e; gap: 2px; }
.pcard .ix i { font-style: normal; font-size: 9px; color: #8a2a2a; }
.pcard .ix.tl { left: 8px; top: 8px; } .pcard .ix.br { right: 8px; bottom: 8px; transform: rotate(180deg); }
.pcard .by { position: absolute; right: 8px; top: 9px; display: flex; gap: 3px; }
.pcard .by i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--ivory), 0 0 0 2.5px rgba(0,0,0,.25); }
.slot.lower .pcard { background: rgba(0,0,0,.18); box-shadow: inset 0 0 0 1px var(--brass-dim), inset 0 0 0 5px transparent, inset 0 0 0 6px rgba(201,164,92,.25); color: var(--brass); }
.slot.lower .pcard::before { content: "↓"; color: rgba(201,164,92,.08); font-size: 100px; }
.slot.lower .pcard .v { font-size: 22px; text-align: center; line-height: 1.35; }
.slot.lower .pcard .v small { display: block; font: 600 11px var(--sans); color: var(--muted); }
.chips { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; min-height: 34px; padding: 0 6px; }
.slot .chips { --stack: -18px; }

/* 背面 */
.back { position: relative; width: 100%; height: 100%; border-radius: 9px; overflow: hidden;
  background:
    repeating-linear-gradient(45deg, rgba(236,208,142,.16) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-45deg, rgba(236,208,142,.16) 0 1px, transparent 1px 9px),
    linear-gradient(#7d1f26, #5a141a);
  box-shadow: 0 10px 18px rgba(0,0,0,.55), inset 0 0 0 5px var(--ivory), inset 0 0 0 6px rgba(0,0,0,.2), inset 0 0 0 9px transparent, inset 0 0 0 10px rgba(236,208,142,.45);
}
.back::after { content: "智"; position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
  display: grid; place-items: center; font: 700 17px/1 var(--serif); color: #5a141a; background: radial-gradient(circle at 40% 35%, var(--brass-hi), var(--brass)); box-shadow: 0 0 0 2px #5a141a, 0 0 0 3px var(--brass-dim); }

/* =========================================================
   ② 席位卡：筹码形座位章 + 大名字 + 衬线大余额 + 状态小灯
   ========================================================= */
.seats { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.seat { position: absolute; width: 184px; pointer-events: auto; display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto; gap: 2px 12px; align-items: center;
  padding: 12px 14px 12px 12px; border-radius: 16px;
  background: linear-gradient(160deg, rgba(20,34,27,.92), rgba(7,14,10,.92)); box-shadow: inset 0 0 0 1px rgba(201,164,92,.3), 0 12px 24px rgba(0,0,0,.45);
}
.seat .av { --s: 52px; grid-row: span 2; }
.seat .av::after { font-size: 19px; }
.seat .nm { font: 800 17px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .nm .you { display: inline-block; margin-left: 4px; padding: 2px 5px; border-radius: 4px; font: 800 10px/1 var(--sans); vertical-align: 2px; color: #1a1408; background: var(--brass); }
.seat .st { display: flex; align-items: baseline; gap: 6px; min-height: 28px; }
.seat .sc { font: 700 26px/1 var(--serif); color: #fff6df; font-variant-numeric: tabular-nums; }
.seat .sc small { font: 600 12px var(--sans); color: var(--muted); margin-left: 2px; }
.seat .tag { font: 700 13px/1 var(--sans); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seat .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #58605a; }
.seat.done .tag { color: var(--up); }
.seat.done .tag::before { background: var(--up); box-shadow: 0 0 8px var(--up); }
.seat:not(.done) .tag::after { content: "…"; animation: glow 1s steps(2) infinite; }
.seat.me { box-shadow: inset 0 0 0 1.5px var(--brass), 0 0 30px rgba(201,164,92,.25), 0 12px 24px rgba(0,0,0,.45); }
.seat .dl { font: 800 15px/1 var(--serif); padding: 3px 6px; border-radius: 6px; opacity: 0; }
.seat .dl.up { color: #0f2a1d; background: var(--up); } .seat .dl.down { color: #2a0f0f; background: var(--down); } .seat .dl.zero { color: var(--muted); background: rgba(255,255,255,.08); }
.seat .au { position: absolute; right: 10px; top: -10px; font: 800 10px/1 var(--sans); color: #1a1408; background: linear-gradient(var(--brass-hi), var(--brass)); padding: 3px 6px; border-radius: 5px; opacity: 0; }
.seat .rank { position: absolute; left: -8px; top: -10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 13px/1 var(--serif);
  background: #0b1a14; color: var(--muted); box-shadow: inset 0 0 0 1px var(--brass-dim); opacity: 0; }
.seat.top { box-shadow: inset 0 0 0 2px var(--brass-hi), 0 0 44px rgba(236,208,142,.45), 0 12px 24px rgba(0,0,0,.45); }
.seat.top .rank { background: linear-gradient(var(--brass-hi), var(--brass)); color: #1a1408; }
.seat.top .rank::before { content: "♛"; position: absolute; top: -17px; font-size: 16px; color: var(--brass-hi); text-shadow: 0 0 8px rgba(236,208,142,.8); }
.seat:nth-child(1) { left: 22px; top: 246px; } .seat:nth-child(2) { left: 14px; top: 384px; } .seat:nth-child(3) { left: 26px; top: 522px; }
.seat:nth-child(4) { right: 22px; top: 246px; } .seat:nth-child(5) { right: 14px; top: 384px; } .seat:nth-child(6) { right: 26px; top: 522px; }

/* ---------- 作答 ---------- */
.pile { position: absolute; left: 50%; top: 330px; width: 300px; height: 176px; transform: translateX(-50%); z-index: 4; }
.facedown { position: absolute; left: 50%; top: 10px; width: 94px; height: 132px; margin-left: calc(-47px + (var(--i, 0) - 1.5) * 26px); transform: rotate(calc((var(--i, 0) - 1.5) * 7deg)); }
.facedown.flying { position: static; margin: 0; transform: none; }
.pile-count { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 14px; color: var(--muted); }
.pile-count b { font-size: 22px; color: var(--txt); }
.entry { position: absolute; left: 50%; top: 524px; transform: translateX(-50%); width: 420px; text-align: center; z-index: 4; }
.entry-label { font-size: 13px; letter-spacing: .3em; color: var(--brass); }
.entry-field { margin: 10px auto 8px; height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(0,0,0,.35); border: 1px solid var(--brass); border-radius: 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,.5); }
.entry-value { font-size: 44px; color: #fff6df; }

.entry-unit { color: var(--muted); }
.entry-hint { font-size: 12px; color: var(--muted); }

/* ---------- 下注 ---------- */
.tray { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; z-index: 6;
  padding: 12px 20px; background: linear-gradient(rgba(14,26,20,.95), rgba(7,14,10,.95)); border: 1px solid var(--brass-dim); border-radius: 16px; box-shadow: 0 16px 30px rgba(0,0,0,.5); }
.tray-bal { font-size: 13px; color: var(--muted); }
.tray-bal b { font: 700 30px/1 var(--serif); color: var(--brass-hi); }
.bet { display: flex; align-items: center; gap: 12px; padding-left: 18px; border-left: 1px solid rgba(201,164,92,.2); }
.bet .chip { --s: 46px; }
.bet-to { font: 700 17px/1.1 var(--serif); }
.bet-to small { font: 700 12px/1 var(--sans); color: var(--brass); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--brass-dim); background: transparent; color: var(--txt); font-size: 18px; }
.stepper span { min-width: 36px; text-align: center; font: 700 18px var(--serif); }

/* =========================================================
   ③ 揭晓结算：黄铜答案牌匾 → 胜出牌升起 + 扫光 + 「最接近」绶带 → 筹码飞回主人 → 席位卡逐个计分 → 第一名皇冠
   ========================================================= */
.reveal { position: absolute; left: 50%; top: 136px; transform: translateX(-50%); z-index: 5; text-align: center;
  padding: 12px 34px 10px; border-radius: 14px; background: linear-gradient(#1c1408, #0d0904);

.rv-label { font: 700 12px/1 var(--sans); letter-spacing: .4em; color: var(--brass); }
.rv-value { margin-top: 6px; font: 800 72px/1 var(--serif); color: var(--brass-hi); text-shadow: 0 0 24px rgba(255,210,120,.5); font-variant-numeric: tabular-nums; }
.rv-value small { font: 600 18px var(--sans); color: var(--muted); margin-left: 6px; }
.rv-src { margin-top: 6px; font-size: 11px; color: var(--muted); }
[data-screen="settlement"] .question { top: 66px; }

[data-screen="settlement"] .board { top: 322px; }

.slot.win .pcard { transform: translateY(-10px) scale(1.12); transition: transform 380ms cubic-bezier(.34,1.56,.64,1); }
.slot.win .pcard::after { content: ""; position: absolute; top: -20%; left: -60%; width: 40%; height: 140%; transform: rotate(18deg) translateX(0);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: sweep 1.6s ease-in-out .2s infinite; }
@keyframes sweep { 0% { transform: rotate(18deg) translateX(0); } 55%, 100% { transform: rotate(18deg) translateX(420%); } }
.slot.win::before { content: "最接近"; position: absolute; left: 50%; top: -16px; transform: translateX(-50%); z-index: 3; white-space: nowrap;
  padding: 4px 12px; font: 800 12px/1 var(--sans); letter-spacing: .2em; color: #1a1408; background: linear-gradient(var(--brass-hi), var(--brass)); border-radius: 4px;
  box-shadow: 0 3px 0 rgba(0,0,0,.45); }
.slot.lose { opacity: .34; filter: saturate(.25); }

.dock { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; z-index: 6; }
.dock-wait { font: 600 15px var(--serif); color: var(--brass); letter-spacing: .2em; }

<body data-title="A2 · 深夜赌场贵宾厅（修订稿）" data-note="对照 A 原稿：① 牌角索引 + 纸纹 + 菱格牌背；筹码有厚度与镶片 ② 席位卡：筹码座位章 + 大名字 + 衬线大余额 + 状态灯 ③ 结算：黄铜答案牌匾、胜出牌升起扫光、筹码飞回主人、席位逐个计分、第一名皇冠">
<script src="_shared.js"></script>
<script>
const chip = (p, id, extra, cls = '') => `<span class="chip${cls}" style="--pc:${p.c}" data-l="${id}" data-pid="${p.id}">${extra ? `<em>+${extra}</em>` : ''}</span>`;
WWUse({
  decor: () => '<div class="room"></div><div class="cone"></div><div class="smoke"></div><div class="table"></div><div class="lamp"></div>',
  seat: (p, s) => {
    const name = `<div class="nm">${p.name}${p.me ? '<span class="you">你</span>' : ''}</div>`;
    const av = `<span class="chip av" style="--pc:${p.c}" data-l="${p.seat}"></span>`;
    if (s === 'answering') return `${av}${name}<div class="st"><span class="tag">${p.submitted ? '已交牌' : '思考中'}</span></div>`;
    if (s === 'settlement') {
      const cls = p.delta > 0 ? 'up' : p.delta < 0 ? 'down' : 'zero';
      return `<span class="rank">${WW.ranked('after').indexOf(p) + 1}</span>${p.author ? '<span class="au">作者 +3</span>' : ''}${av}${name}
        <div class="st"><span class="sc" data-from="${p.before}" data-to="${p.after}">${p.before}</span><span class="dl ${cls}">${p.delta > 0 ? '+' : ''}${p.delta}</span></div>`;
    }
    return `${av}${name}<div class="st"><span class="sc">${p.before}<small>分</small></span></div>`;
  },
  back: () => '<div class="back"></div>',
  card: (t) => {
    if (t.value === null) return '<div class="odds"><small>净赢</small>×6</div><div class="pcard"><span class="v">更低<small>比所有牌都小</small></span></div>';
    const v = WW.fmt(t.value);
    return `<div class="odds"><small>净赢</small>×${t.odds}</div>
      <div class="pcard"><span class="ix tl">${v}<i>♠</i></span><span class="ix br">${v}<i>♠</i></span>
        <span class="by">${t.authors.map((a) => `<i style="--c:${a.c}"></i>`).join('')}</span><span class="v">${v}</span><span class="u">米</span></div>`;
  },
  chip: (p, id, extra) => chip(p, id, extra),
  ledger: () => '',
  // ③ 结算：筹码飞回主人（胜出格高抛、落败格低掠），再按名次逐个计分，最后给第一名戴冠
  play: async (device, state) => {
    if (state.screen !== 'settlement') return;
    const seatOf = (pid) => device.querySelector(`[data-seat="${pid}"]`);
    const flights = [...device.querySelectorAll('.slot .chips .chip')].map((c, i) => {
      const win = c.closest('.slot').classList.contains('win');
      const f = WW.fly(c, seatOf(c.dataset.pid).querySelector('.av'), c.outerHTML, { arc: win ? 150 : 30, ms: win ? 640 : 460, spin: win ? 540 : 0, endScale: 0.8, delay: i * 70 });
      // 替身在延迟期间就停在原位（fill: both），所以原物件立刻藏起，交接无缝
      c.style.visibility = 'hidden';
      return f;
    });
    await WW.gate(Promise.all(flights));
    for (const p of [...WW.PLAYERS].reverse().sort((a, b) => a.after - b.after)) {
      const seat = seatOf(p.id);
      seat.querySelector('.av').animate([{ scale: '1.3' }, { scale: '1' }], { duration: 260, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      const dl = seat.querySelector('.dl'), au = seat.querySelector('.au');
      dl.style.opacity = 1;
      dl.animate([{ transform: 'translateY(8px) scale(.6)', opacity: 0 }, { transform: 'translateY(-3px) scale(1.2)', opacity: 1 }, { transform: 'none', opacity: 1 }], { duration: 360, easing: 'ease-out' });
      if (au) { au.style.opacity = 1; au.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 300 }); }
      const sc = seat.querySelector('.sc');
      WW.countUp(sc, +sc.dataset.from, +sc.dataset.to, 500);
      await WW.wait(200);
    }
    await WW.wait(450);
    device.querySelectorAll('.seat .rank').forEach((r) => { r.style.opacity = 1; });
    const top = seatOf(WW.ranked('after')[0].id);
    top.classList.add('top');
    top.animate([{ scale: '1' }, { scale: '1.06' }, { scale: '1' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  },
});
</script>
