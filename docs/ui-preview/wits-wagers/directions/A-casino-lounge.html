<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一智千金 · A 深夜赌场贵宾厅</title>
<link rel="stylesheet" href="_shared.css">
<style>
/* =========================================================
   A 深夜赌场贵宾厅
   世界：打烊后的贵宾厅，一盏绿罩吊灯压在椭圆毡桌上；答案牌是象牙色扑克牌，下注是真筹码。
   表皮：深色悬疑 → 墨绿毡 + 黄铜细边，金色只做描边与大字。
   ========================================================= */
.device {
  --felt: #0f3b2c; --felt-2: #0a2a1f; --brass: #c9a45c; --brass-dim: rgba(201,164,92,.45);
  --ivory: #f3ead6; --ink: #1c1a15; --txt: #efe6d2; --muted: #a79f8b;
  background: #07100c; color: var(--txt); --ring-bg: #0b1a14;
}
.decor { position: absolute; inset: 0; pointer-events: none; }
.decor .room { position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 64px),
    radial-gradient(90% 70% at 50% 40%, #16261f 0%, #070d0a 70%);
}
.decor .lamp { position: absolute; left: 50%; top: -30px; width: 280px; height: 70px; transform: translateX(-50%);
  background: linear-gradient(#1f4a36, #0d2a1e); border-radius: 0 0 140px 140px / 0 0 60px 60px;
  border-bottom: 2px solid var(--brass); box-shadow: 0 16px 50px rgba(255,220,140,.35);
}
.decor .cone { position: absolute; left: 50%; top: 30px; width: 1100px; height: 760px; transform: translateX(-50%);
  background: radial-gradient(50% 55% at 50% 0%, rgba(255,226,160,.20), rgba(255,226,160,.06) 55%, transparent 75%);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
}
.decor .table { position: absolute; left: 50%; top: 190px; width: 1080px; height: 560px; transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(60% 55% at 50% 35%, #1b5a42 0%, var(--felt) 45%, var(--felt-2) 100%);
  box-shadow: 0 0 0 14px #2a1a10, 0 0 0 16px var(--brass-dim), 0 0 0 26px #1a0f09, 0 40px 80px rgba(0,0,0,.7), inset 0 0 90px rgba(0,0,0,.55);
}
.decor .table::after { content: "一 智 千 金 · 贵 宾 厅"; position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
  font: 600 15px/1 var(--serif); letter-spacing: .6em; color: rgba(201,164,92,.28); white-space: nowrap;
}
.decor .smoke { position: absolute; left: 20%; top: 120px; width: 60%; height: 200px; opacity: .5;
  background: radial-gradient(40% 50% at 30% 50%, rgba(255,255,255,.05), transparent), radial-gradient(35% 45% at 70% 40%, rgba(255,255,255,.04), transparent);
  animation: breathe 7s ease-in-out infinite;
}

.hud { position: absolute; left: 32px; right: 32px; top: 22px; display: flex; align-items: center; gap: 14px; z-index: 5; }
.hud .round { font-size: 14px; color: var(--muted); }
.hud .round b { font-size: 22px; color: var(--brass); }
.hud .phase { padding: 5px 14px; border: 1px solid var(--brass-dim); border-radius: 999px; font: 700 13px/1 var(--sans); letter-spacing: .2em; color: var(--brass); }
.hud .ring { margin-left: auto; --ring: var(--brass); }

.question { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); width: 760px; text-align: center; z-index: 4; }
.q-kicker { font: 600 13px/1 var(--sans); letter-spacing: .3em; color: var(--brass); }
.q-text { margin: 12px 0 6px; font: 700 40px/1.2 var(--serif); color: #fff6df; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
.q-unit { font-size: 14px; color: var(--muted); }

/* 席位：围着椭圆桌左右各三 */
.seats { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.seat { position: absolute; width: 150px; pointer-events: auto; display: grid; grid-template-columns: 44px 1fr; gap: 2px 10px; align-items: center;
  padding: 10px 12px; background: rgba(8,16,12,.78); border: 1px solid rgba(201,164,92,.28); border-radius: 14px; backdrop-filter: blur(2px);
}
.seat .av { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pc); color: #1a1408; font: 800 16px/1 var(--serif);
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.35), inset 0 0 0 6px var(--pc), inset 0 0 0 7px rgba(0,0,0,.25);
}
.seat .nm { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .st { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.seat .st .num { font-size: 18px; color: var(--txt); }
.seat.me { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 24px rgba(201,164,92,.25); }
.seat .tag { font-size: 11px; color: var(--muted); }
.seat.done .tag { color: #9fe0bd; }
.seat.done .tag::before { content: "● "; }
.seat:nth-child(1) { left: 34px; top: 250px; } .seat:nth-child(2) { left: 22px; top: 390px; } .seat:nth-child(3) { left: 40px; top: 530px; }
.seat:nth-child(4) { right: 34px; top: 250px; } .seat:nth-child(5) { right: 22px; top: 390px; } .seat:nth-child(6) { right: 40px; top: 530px; }

/* 版图：印在毡面上的下注格 */
.board { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); display: flex; gap: 14px; z-index: 4; perspective: 900px; }
.slot { position: relative; width: 118px; height: 232px; border: 1.5px solid var(--brass-dim); border-radius: 12px;
  display: grid; grid-template-rows: auto 1fr; justify-items: center; padding: 12px 8px; transition: filter 300ms, opacity 300ms;
}
.slot .odds { font: 700 22px/1 var(--serif); color: var(--brass); }
.slot .odds small { font: 600 11px/1 var(--sans); display: block; text-align: center; color: var(--muted); margin-top: 4px; letter-spacing: .1em; }
.pcard { margin-top: 10px; width: 92px; height: 128px; border-radius: 9px; background: var(--ivory); color: var(--ink);
  display: grid; place-items: center; position: relative; box-shadow: 0 8px 16px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.08), inset 0 0 0 5px var(--ivory), inset 0 0 0 6px rgba(160,120,60,.35);
}
.pcard .v { font: 700 30px/1 var(--serif); }
.pcard .u { position: absolute; bottom: 10px; font-size: 11px; color: #7a6d55; }
.pcard .by { position: absolute; top: 8px; left: 8px; display: flex; gap: 3px; }
.pcard .by i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.slot.lower .pcard { background: transparent; box-shadow: inset 0 0 0 1.5px var(--brass-dim); color: var(--brass); }
.slot.lower .pcard .v { font-size: 20px; line-height: 1.3; text-align: center; }
.chips { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 30px; padding: 0 6px; }
.chip { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--pc); color: #1a1408; font: 800 11px/1 var(--sans);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), inset 0 0 0 5px var(--pc), inset 0 0 0 6px rgba(0,0,0,.2), 0 3px 0 rgba(0,0,0,.45);
  background-image: repeating-conic-gradient(rgba(255,255,255,.55) 0 12deg, transparent 12deg 45deg);
  position: relative;
}
.chip::after { content: attr(data-l); position: absolute; inset: 6px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; }
.chip em { position: absolute; top: -6px; right: -8px; font: 800 10px/1 var(--sans); font-style: normal; color: var(--ink); background: var(--ivory); border-radius: 6px; padding: 2px 4px; z-index: 1; }
.slot.win { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass), 0 0 50px rgba(255,210,120,.45); animation: glow 1.4s ease-in-out infinite; }
.slot.win .pcard { transform: translateY(-6px); }
.slot.lose { opacity: .38; filter: saturate(.3); }

/* 作答：背面牌堆 + 输入 */
.pile { position: absolute; left: 50%; top: 330px; width: 300px; height: 170px; transform: translateX(-50%); z-index: 4; }
.facedown { position: absolute; left: 50%; top: 10px; width: 92px; height: 128px; margin-left: calc(-46px + (var(--i, 0) - 1.5) * 26px); transform: rotate(calc((var(--i, 0) - 1.5) * 7deg)); }
.facedown.flying { position: static; margin: 0; transform: none; }
.back { width: 100%; height: 100%; border-radius: 9px; background: #7a1f24; box-shadow: 0 8px 16px rgba(0,0,0,.5), inset 0 0 0 5px #f3ead6, inset 0 0 0 6px rgba(0,0,0,.2);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 3px, transparent 3px 10px); }
.pile-count { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 14px; color: var(--muted); }
.pile-count b { font-size: 22px; color: var(--txt); }
.entry { position: absolute; left: 50%; top: 520px; transform: translateX(-50%); width: 420px; text-align: center; z-index: 4; }
.entry-label { font-size: 13px; letter-spacing: .3em; color: var(--brass); }
.entry-field { margin: 10px auto 8px; height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(0,0,0,.35); border: 1px solid var(--brass); border-radius: 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,.5);
}
.entry-value { font-size: 44px; color: #fff6df; }
.entry-value::after { content: ""; display: inline-block; width: 2px; height: 36px; margin-left: 4px; background: var(--brass); vertical-align: -4px; animation: glow 1s steps(2) infinite; }
.entry-unit { color: var(--muted); }
.entry-hint { font-size: 12px; color: var(--muted); }

/* 下注：我的两枚筹码 */
.tray { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; z-index: 6;
  padding: 10px 18px; background: rgba(8,16,12,.85); border: 1px solid var(--brass-dim); border-radius: 16px; }
.tray-bal { font-size: 13px; color: var(--muted); }
.tray-bal b { font-size: 28px; color: var(--brass); }
.bet { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid rgba(201,164,92,.2); }
.bet .chip { width: 40px; height: 40px; font-size: 14px; }
.bet-to { font: 700 16px/1.1 var(--serif); }
.bet-to small { font: 600 12px/1 var(--sans); color: var(--brass); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--brass-dim); background: transparent; color: var(--txt); font-size: 18px; }
.stepper span { min-width: 34px; text-align: center; font-size: 18px; }

/* 结算 */
.reveal { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); text-align: center; z-index: 4; }
.rv-label { display: none; }
.rv-value { font: 800 76px/1 var(--serif); color: var(--brass); text-shadow: 0 0 30px rgba(255,210,120,.4); }
.rv-value small { font: 600 18px var(--sans); color: var(--muted); margin-left: 6px; }
.rv-src { font-size: 12px; color: var(--muted); margin-top: 6px; }
[data-screen="settlement"] .question { top: 62px; }
[data-screen="settlement"] .q-text { font-size: 22px; margin: 8px 0 0; color: var(--muted); }
[data-screen="settlement"] .q-unit { display: none; }
[data-screen="settlement"] .board { top: 262px; transform: translateX(-50%) scale(.86); transform-origin: top center; }
.ledger { position: absolute; left: 50%; top: 492px; transform: translateX(-50%); width: 620px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; z-index: 4; }
.row { display: grid; grid-template-columns: 22px 1fr auto auto 40px; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.35); border-left: 3px solid var(--pc); }
.row .rk { color: var(--muted); } .row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .dl { font-size: 15px; } .row .dl.up { color: #9fe0bd; } .row .dl.down { color: #e79a8a; }
.row .au { font-size: 10px; color: var(--brass); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 2px 4px; }
.row .sc { font-size: 22px; text-align: right; color: #fff6df; }
.row.me { background: rgba(201,164,92,.14); }
.device[data-screen="settlement"] .seats { display: none; }

.dock { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; z-index: 6; }
.dock-wait { font: 600 15px var(--serif); color: var(--brass); letter-spacing: .2em; }

/* ---------------- 手机 390×844 ---------------- */
[data-size="mobile"] .decor .table { top: 250px; width: 560px; height: 560px; }
[data-size="mobile"] .decor .table::after { display: none; }
[data-size="mobile"] .decor .lamp { width: 180px; }
[data-size="mobile"] .hud { left: 16px; right: 16px; top: 14px; }
[data-size="mobile"] .question { top: 80px; width: 350px; }
[data-size="mobile"] .q-text { font-size: 24px; }
[data-size="mobile"] .seats { position: absolute; inset: auto 10px auto 10px; top: 196px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
[data-size="mobile"] .seat { position: static; width: auto; grid-template-columns: 28px 1fr; padding: 6px 8px; gap: 0 6px; }
[data-size="mobile"] .seat .av { width: 28px; height: 28px; font-size: 12px; }
[data-size="mobile"] .seat .nm { font-size: 13px; }
[data-size="mobile"] .seat .st .num { font-size: 14px; }
[data-size="mobile"] .board { top: 320px; display: grid; grid-template-columns: repeat(3, 108px); gap: 10px; }
[data-size="mobile"] .slot { width: 108px; height: 176px; padding: 8px 6px; }
[data-size="mobile"] .chips { bottom: 4px; min-height: 24px; }
[data-size="mobile"] .slot .chips { --stack: -12px; }
[data-size="mobile"] .pcard { width: 76px; height: 86px; margin-top: 6px; }
[data-size="mobile"] .pcard .v { font-size: 25px; }
[data-size="mobile"] .slot .odds { font-size: 18px; }
[data-size="mobile"] .chip { width: 24px; height: 24px; font-size: 9px; }
[data-size="mobile"] .pile { top: 300px; }
[data-size="mobile"] .entry { top: 510px; width: 340px; }
[data-size="mobile"] .tray { left: 10px; right: 10px; transform: none; bottom: 92px; flex-wrap: wrap; gap: 8px; padding: 10px; }
[data-size="mobile"] .tray-bal { width: 100%; }
[data-size="mobile"] .bet { flex: 1; padding-left: 0; border: 0; gap: 6px; }
[data-size="mobile"] .bet .chip { width: 32px; height: 32px; }
[data-size="mobile"] .bet-to { font-size: 14px; }
[data-size="mobile"] .stepper button { width: 30px; height: 30px; }
[data-size="mobile"] .stepper span { min-width: 26px; font-size: 15px; }
[data-size="mobile"][data-screen="betting"] .board { top: 306px; }
[data-size="mobile"][data-screen="betting"] .slot { height: 150px; }
[data-size="mobile"][data-screen="betting"] .pcard { height: 70px; }
[data-size="mobile"] .pcard .u { bottom: 4px; }
[data-size="mobile"] .reveal { top: 130px; }
[data-size="mobile"] .rv-value { font-size: 60px; }
[data-size="mobile"][data-screen="settlement"] .q-text { font-size: 16px; }
[data-size="mobile"][data-screen="settlement"] .board { top: 240px; transform: translateX(-50%) scale(.78); }
[data-size="mobile"] .ledger { top: 540px; width: 360px; grid-template-columns: 1fr; gap: 4px; }
[data-size="mobile"] .row { padding: 4px 10px; }
[data-size="mobile"] .row .sc { font-size: 18px; }
[data-size="mobile"] .dock { bottom: 22px; padding: 0 16px; }
[data-size="mobile"] .cta { width: 100%; }
</style>
</head>
<body data-title="A · 深夜赌场贵宾厅" data-note="对标狼人杀（左右席位）+ Balatro 筹码手感 ｜ 椭圆毡桌 + 吊灯；答案是象牙扑克牌，下注是真筹码 ｜ 与 B/C 差别：最「牌桌」，构图是围桌而坐">
<script src="_shared.js"></script>
<script>
WWUse({
  decor: () => '<div class="room"></div><div class="cone"></div><div class="smoke"></div><div class="table"></div><div class="lamp"></div>',
  seat: (p, s) => `<div class="av">${p.seat}</div><div class="nm">${p.name}${p.me ? '（你）' : ''}</div>
    <div class="st">${s === 'answering' ? `<span class="tag">${p.submitted ? '已交牌' : '思考中…'}</span>` : `<span class="num">${p.before}</span><span>分</span>`}</div>`,
  back: () => '<div class="back"></div>',
  card: (t, s) => `<div class="odds">×${t.odds}<small>净赢</small></div>
    <div class="pcard">${t.value === null ? '<span class="v">更低<br><small style="font-size:12px">比所有牌都小</small></span>' : `<span class="by">${t.authors.map((a) => `<i style="--c:${a.c}"></i>`).join('')}</span><span class="v">${WW.fmt(t.value)}</span><span class="u">米</span>`}</div>`,
  chip: (p, id, extra) => `<span class="chip" style="--pc:${p.c}" data-l="${id}">${extra ? `<em>+${extra}</em>` : ''}</span>`,
});
</script>
</body>
</html>
