<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>以鹅传鹅 · A 牧场接力赛</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* A 牧场接力赛（浅色派对表皮）：晴天牧场，一条土路绕着中央草坪，鹅们站在路边排队接力；
     中央草坪是"舞台"：正在表演的鹅放大成主角卡，下一棒的鹅在旁边盯着看。传的是一枚金蛋。 */
  :root {
    --sky-top: #bfe6f2; --sky-low: #eaf7ee;
    --hill-a: #9fd27c; --hill-b: #7fc06a;
    --grass: #8fcb6b; --grass-dark: #5fa64e;
    --road: #f1d49a; --road-dark: #d9b26c;
    --fence: #c98b4e;
    --mint: #2f9e7a;
    --coral: #e2574c;
    --border: 3px solid var(--ink);
    --shadow: 0 5px 0 var(--ink);
    --shadow-sm: 0 3px 0 var(--ink);
  }

  /* ---------- 场景 ---------- */
  .device { background: linear-gradient(var(--sky-top), var(--sky-low) 34%, var(--grass) 34.2%); }
  .sun {
    position: absolute; right: 84px; top: 34px; width: 86px; height: 86px; border-radius: 50%;
    background: #ffe58a; border: var(--border); box-shadow: 0 0 0 14px rgba(255,229,138,.35);
  }
  .cloud {
    position: absolute; height: 30px; background: var(--cream); border: var(--border); border-radius: 999px;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cream); border: var(--border); border-bottom: 0; border-radius: 999px 999px 0 0; }
  .cloud::before { left: 18%; bottom: 60%; width: 42%; height: 26px; }
  .cloud::after { left: 48%; bottom: 60%; width: 30%; height: 18px; }
  .hills { position: absolute; left: 0; right: 0; top: calc(34% - 70px); height: 80px; }
  .hills i { position: absolute; bottom: 0; height: 100%; border: var(--border); border-bottom: 0; border-radius: 50% 50% 0 0; }
  .hills i:nth-child(1) { left: -6%; width: 46%; background: var(--hill-b); height: 70%; }
  .hills i:nth-child(2) { left: 30%; width: 50%; background: var(--hill-a); }
  .hills i:nth-child(3) { right: -8%; width: 40%; background: var(--hill-b); height: 80%; }
  .grass-tex {
    position: absolute; left: 0; right: 0; bottom: 0; top: 34%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.12) 0 2px, transparent 3px) 0 0/46px 38px,
      radial-gradient(circle at 70% 60%, rgba(41,39,34,.08) 0 2px, transparent 3px) 0 0/58px 44px;
  }
  .fence { position: absolute; left: 0; right: 0; top: calc(34% - 6px); height: 40px; opacity: .9; }
  .fence::before {
    content: ""; position: absolute; inset: 10px 0 auto; height: 8px; background: var(--fence);
    border-block: 2.5px solid var(--ink); box-shadow: 0 16px 0 -0px var(--fence), 0 16px 0 2.5px var(--ink);
  }
  .fence::after {
    content: ""; position: absolute; inset: 0; background:
      linear-gradient(90deg, transparent 0 34px, var(--ink) 34px 37px, var(--fence) 37px 49px, var(--ink) 49px 52px, transparent 52px) 0 0/88px 100%;
  }
  .flowers span { position: absolute; font-size: 18px; opacity: .85; }

  /* ---------- 土路（接力路线） ---------- */
  .links path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .links path[data-layer="edge"] { stroke: var(--ink); stroke-width: 34; }
  .links path[data-layer="road"] { stroke: var(--road); stroke-width: 28; transition: stroke 300ms; }
  .links path[data-layer="dash"] { stroke: var(--road-dark); stroke-width: 3; stroke-dasharray: 2 14; }
  .links path.done[data-layer="road"] { stroke: #fbe7b8; }
  .links path.next[data-layer="dash"] { stroke: var(--coral); stroke-width: 4; stroke-dasharray: 10 10; animation: march 700ms linear infinite; }
  [data-size="mobile"] .links path[data-layer="edge"] { stroke-width: 22; }
  [data-size="mobile"] .links path[data-layer="road"] { stroke-width: 17; }

  /* ---------- 席位：路边的鹅牌 ---------- */
  .goose {
    position: relative; width: 112px; padding: 6px 6px 8px; background: var(--cream);
    border: var(--border); border-radius: 16px; box-shadow: var(--shadow-sm); text-align: center;
    transition: transform 200ms cubic-bezier(.34,1.56,.64,1), opacity 200ms, box-shadow 200ms;
  }
  .goose .pic { position: relative; height: 78px; border: 2.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff4df; }
  .goose .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  .goose .name { margin-top: 5px; font-weight: 900; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goose .no {
    position: absolute; left: -10px; top: -10px; width: 30px; height: 30px; display: grid; place-items: center; z-index: 2;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 50%; font: 700 15px var(--serif); box-shadow: 0 2px 0 var(--ink);
  }
  .goose .tag {
    position: absolute; left: 50%; top: -14px; translate: -50% 0; z-index: 3; display: none;
    font: 900 12px/1 var(--sans); padding: 5px 9px; border: 2.5px solid var(--ink); border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 0 var(--ink);
  }
  .goose .check {
    position: absolute; right: -10px; top: -10px; width: 30px; height: 30px; z-index: 2; display: none; place-items: center;
    background: var(--mint); color: #fff; border: 2.5px solid var(--ink); border-radius: 50%; font: 900 15px var(--sans);
  }
  .goose .you { display: none; margin-left: 4px; font: 900 11px var(--sans); padding: 1px 6px; border-radius: 999px; background: var(--ink); color: var(--cream); vertical-align: 2px; }
  .goose.is-me .you { display: inline-block; }
  .goose.is-head .no { background: var(--ink); color: #ffe58a; }
  .goose.is-done { opacity: .6; transform: scale(.92); }
  .goose.is-done .check { display: grid; }
  .goose.is-active { transform: scale(1.14); box-shadow: 0 0 0 5px var(--mint), var(--shadow); z-index: 5; }
  .goose.is-active .tag { display: block; background: var(--mint); color: #fff; }
  .goose.is-active .tag::before { content: "表演中"; }
  .goose.is-active .pic img { animation: wiggle 700ms ease-in-out infinite; transform-origin: 50% 90%; }
  .goose.is-next .tag { display: block; background: var(--cream); }
  .goose.is-next .tag::before { content: "👀 在看"; }
  .goose.is-me.is-next .tag::before { content: "👀 你在看"; }
  [data-size="mobile"] .goose { width: 66px; padding: 4px 4px 5px; border-radius: 12px; }
  [data-size="mobile"] .goose .pic { height: 46px; border-width: 2px; border-radius: 8px; }
  [data-size="mobile"] .goose .name { font-size: 11px; margin-top: 3px; }
  [data-size="mobile"] .goose .no { width: 22px; height: 22px; font-size: 12px; left: -7px; top: -7px; border-width: 2px; }
  [data-size="mobile"] .goose .check { width: 22px; height: 22px; font-size: 12px; right: -7px; top: -7px; }
  [data-size="mobile"] .goose .you { display: none; }
  [data-size="mobile"] .goose.is-me { box-shadow: 0 0 0 3px var(--ink), var(--shadow-sm); }
  [data-size="mobile"] .goose.is-me.is-active { box-shadow: 0 0 0 4px var(--mint), var(--shadow); }
  [data-size="mobile"] .goose .tag { font-size: 10px; padding: 3px 6px; top: -12px; }

  /* ---------- 中央草坪舞台 ---------- */
  .lawn {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%;
    width: 640px; height: 360px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.55), rgba(255,255,255,0) 64%);
  }
  .stage {
    position: absolute; left: 50%; top: 350px; translate: -50% 0; width: 700px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 18px;
  }
  .sign {
    position: absolute; left: 50%; top: 240px; translate: -50% 0; rotate: -1.5deg; z-index: 6;
    padding: 10px 26px 12px; background: var(--cream); border: var(--border); border-radius: 12px; box-shadow: var(--shadow); text-align: center; white-space: nowrap;
  }
  .sign .title { font-size: 38px; }
  .sign .hint { margin-top: 4px; font-weight: 700; font-size: 15px; color: var(--muted); }
  .sign::before, .sign::after { content: ""; position: absolute; bottom: -34px; width: 10px; height: 32px; background: var(--fence); border: 2.5px solid var(--ink); z-index: -1; }
  .sign::before { left: 30px; } .sign::after { right: 30px; }

  .hero { justify-self: center; text-align: center; }
  .hero .card {
    position: relative; width: 190px; height: 262px; background: var(--cream); border: var(--border); border-radius: 18px;
    box-shadow: 0 7px 0 var(--ink); padding: 8px; transform-origin: 50% 100%;
  }
  .hero .card img { width: 100%; height: 100%; object-fit: cover; border: 2.5px solid var(--ink); border-radius: 11px; display: block; animation: sway 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
  .hero .card .ribbon {
    position: absolute; left: 50%; bottom: -16px; translate: -50% 0; padding: 6px 14px; white-space: nowrap;
    background: var(--mint); color: #fff; border: var(--border); border-radius: 10px; font: 900 15px var(--sans); box-shadow: var(--shadow-sm);
  }
  .motion-lines { position: absolute; inset: -10px -38px; pointer-events: none; }
  .motion-lines i { position: absolute; width: 22px; height: 5px; background: var(--ink); border-radius: 3px; animation: flick 900ms ease-in-out infinite; }
  .motion-lines i:nth-child(1) { left: 0; top: 30%; rotate: -20deg; }
  .motion-lines i:nth-child(2) { left: 4px; top: 46%; animation-delay: 150ms; }
  .motion-lines i:nth-child(3) { right: 0; top: 34%; rotate: 20deg; animation-delay: 300ms; }
  .motion-lines i:nth-child(4) { right: 4px; top: 50%; animation-delay: 450ms; }
  .side { display: grid; justify-items: center; gap: 6px; font-weight: 800; color: var(--ink); }
  .side .mini { width: 104px; height: 142px; padding: 5px; background: var(--cream); border: var(--border); border-radius: 14px; box-shadow: var(--shadow-sm); }
  .side .mini img { width: 100%; height: 100%; object-fit: cover; border: 2px solid var(--ink); border-radius: 9px; display: block; }
  .side .who { font-size: 15px; } .side .what { font-size: 13px; color: var(--muted); font-weight: 700; }
  .side.prev .mini { opacity: .6; rotate: -5deg; }
  .side.next .mini { rotate: 5deg; }
  .eyes { font-size: 26px; animation: bob 1.4s ease-in-out infinite; }
  .gap { visibility: hidden; }

  .progress { position: absolute; left: 50%; bottom: 100px; translate: -50% 0; display: flex; align-items: baseline; gap: 8px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .progress .numeral { font-size: 34px; }

  /* 倒计时：挂在告示牌右侧 */
  .countdown { background: var(--cream); border: var(--border); border-radius: 50%; box-shadow: var(--shadow-sm); }
  .countdown .ring-bg { stroke: #e9e2d0; } .countdown .ring-fg { stroke: var(--mint); }
  .countdown.last10 .ring-fg { stroke: var(--coral); }
  .countdown small { color: var(--ink); }
  #cd { left: 32px; top: 28px; }

  /* ---------- 底部操作坞 ---------- */
  .dock {
    position: absolute; left: 50%; bottom: 20px; translate: -50% 0; width: 760px;
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px;
    background: var(--cream); border: var(--border); border-radius: 18px; box-shadow: var(--shadow);
  }
  .dock .role { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
  .dock .role b { padding: 3px 10px; border-radius: 999px; background: #f5efe0; border: 2px solid var(--ink); }
  .dock .info { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  .dock .btn { border: var(--border); box-shadow: var(--shadow-sm); }
  .dock .btn:disabled { background: #efe9dc; color: var(--muted); }
  .dock .btn-primary:not(:disabled) { animation: breathe 1.4s ease-in-out infinite; }
  .dock .btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .dock .btn-primary:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  /* 金蛋（接力棒） */
  .egg { width: 46px; height: 56px; }

  /* ---------- 手机 ---------- */
  [data-size="mobile"] .sun { right: 18px; top: 16px; width: 48px; height: 48px; box-shadow: 0 0 0 8px rgba(255,229,138,.35); }
  [data-size="mobile"] .device { background: linear-gradient(var(--sky-top), var(--sky-low) 17%, var(--grass) 17.2%); }
  [data-size="mobile"] .hills { top: calc(17% - 44px); height: 50px; }
  [data-size="mobile"] .fence { top: calc(17% - 6px); }
  [data-size="mobile"] .grass-tex { top: 17%; }
  [data-size="mobile"] .lawn { top: 560px; width: 380px; height: 420px; }
  [data-size="mobile"] .sign { top: 360px; padding: 8px 16px 10px; width: max-content; max-width: 350px; white-space: normal; }
  [data-size="mobile"] .sign .title { font-size: 28px; }
  [data-size="mobile"] .sign .hint { font-size: 13px; }
  [data-size="mobile"] .sign::before, [data-size="mobile"] .sign::after { display: none; }
  [data-size="mobile"] .stage { top: 516px; width: 370px; gap: 6px; }
  [data-size="mobile"] .hero .card { width: 132px; height: 182px; padding: 6px; border-radius: 14px; }
  [data-size="mobile"] .hero .card .ribbon { font-size: 12px; padding: 4px 10px; bottom: -14px; }
  [data-size="mobile"] .side .mini { width: 72px; height: 98px; padding: 4px; border-radius: 10px; }
  [data-size="mobile"] .side .who { font-size: 13px; } [data-size="mobile"] .side .what { font-size: 11px; }
  [data-size="mobile"] .motion-lines { inset: -8px -26px; }
  [data-size="mobile"] .eyes { font-size: 20px; }
  [data-size="mobile"] .progress { top: 44px; bottom: auto; }
  [data-size="mobile"] .progress .numeral { font-size: 26px; }
  [data-size="mobile"] #cd { left: 14px; top: 26px; width: 64px; height: 64px; }
  [data-size="mobile"] #cd .num { font-size: 24px; }
  [data-size="mobile"] .dock { width: 366px; bottom: 14px; flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  [data-size="mobile"] .dock .info { display: none; }
  [data-size="mobile"] .dock .btn { flex: 1 0 100%; }

  @keyframes drift { from { translate: 0 0; } to { translate: 40px 0; } }
  @keyframes march { to { stroke-dashoffset: -20; } }
  @keyframes sway { 0%, 100% { rotate: -4deg; } 50% { rotate: 4deg; } }
  @keyframes flick { 0%, 100% { opacity: 0; translate: 0 0; } 50% { opacity: 1; translate: 0 -4px; } }
  @keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.03; } }
</style>
</head>
<body>
<div class="toolbar">
  <strong>A · 牧场接力赛</strong>
  <span class="note">浅色派对 ｜ 对标：榴莲（奶油卡纸 + 粗墨边） ｜ 区别：鹅站在土路两旁排成一条环线，中央草坪放大"谁演给谁看"</span>
  <div class="group"><button data-set-size="desktop" aria-pressed="true">桌面 1280×800</button><button data-set-size="mobile" aria-pressed="false">手机 390×844</button></div>
  <div class="group"><button data-set-count="5">5 人</button><button data-set-count="7">7 人</button><button data-set-count="9">9 人</button></div>
  <div class="group"><button data-act="next">下一棒 ▶</button><button data-act="myturn">跳到我</button><button data-act="last5">最后 5 秒</button><button id="reset">重播</button></div>
</div>
<div class="stage-wrap"><div class="device" data-size="desktop">
  <div class="sun"></div>
  <span class="cloud" style="left:8%;top:9%;width:110px"></span>
  <span class="cloud" style="left:52%;top:5%;width:80px"></span>
  <div class="hills"><i></i><i></i><i></i></div>
  <div class="fence"></div>
  <div class="grass-tex"></div>
  <div class="flowers"><span style="left:4%;top:88%">🌼</span><span style="left:93%;top:84%">🌼</span><span style="left:12%;top:70%">🌷</span><span style="left:86%;top:66%">🌷</span></div>
  <div class="lawn"></div>

  <svg class="links" aria-hidden="true"></svg>
  <div class="seats"></div>

  <div class="sign" data-box="sign">
    <h1 class="title" id="headline"></h1>
    <div class="hint" id="hint"></div>
  </div>
  <div class="countdown" id="cd" data-box="countdown">
    <svg viewBox="0 0 84 84"><circle class="ring-bg" cx="42" cy="42" r="34"/><circle class="ring-fg" cx="42" cy="42" r="34"/></svg>
    <span class="num numeral">30</span>
  </div>

  <div class="stage" data-box="stage">
    <div class="side prev" id="prev"></div>
    <div class="hero" id="hero"></div>
    <div class="side next" id="next"></div>
  </div>
  <div class="progress" data-box="progress"><span>第</span><span class="numeral" id="prog"></span><span>棒</span></div>

  <div class="dock" data-box="dock">
    <div class="role">身份 <b>白鹅</b></div>
    <div class="info">静默传递：只能比划、可以鹅叫，不许说字</div>
    <button class="btn btn-primary" id="act-pass"></button>
  </div>
</div></div>

<script>
  const EGG = `<svg class="egg" viewBox="0 0 46 56" aria-hidden="true">
    <ellipse cx="23" cy="31" rx="19" ry="23" fill="#ffd34d" stroke="#292722" stroke-width="3.5"/>
    <ellipse cx="16" cy="22" rx="5" ry="8" fill="#fff3b8"/>
    <path d="M10 36 l6 -5 l6 5 l6 -5 l6 5 l4 -3" fill="none" stroke="#c98a1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  const card = (p) => `<img src="${p.img}" alt="${p.goose}">`;

  window.DESIGN = {
    linkLayers: ['edge', 'road', 'dash'],
    seat: (p) => `<div class="goose">
      <span class="no">${p.head ? '头' : p.seatNo}</span><span class="tag"></span><span class="check">✓</span>
      <div class="pic">${card(p)}</div>
      <div class="name">${p.name}<span class="you">你</span></div>
    </div>`,
    layout(size, n, w, h) {
      if (size === 'desktop') {
        return GR.ellipsePoints(640, 470, 548, 318, n, Math.PI * 0.94, Math.PI * 2.06);
      }
      // 手机：顶部两排蛇形土路，第一排左→右，第二排右→左
      const top = Math.ceil(n / 2), rest = n - top;
      const row = (k, count, y, rtl) => {
        const span = 300, x0 = 45;
        const x = count === 1 ? w / 2 : x0 + (span * k) / (count - 1);
        return { x: rtl ? w - x : x, y };
      };
      return Array.from({ length: n }, (_, i) => (i < top ? row(i, top, 188, false) : row(i - top, rest, 296, true)));
    },
    linkPath(a, b, i, size) {
      if (size === 'desktop') return `M${a.x} ${a.y} A548 318 0 0 1 ${b.x} ${b.y}`;
      if (Math.abs(a.y - b.y) > 20) return `M${a.x} ${a.y} C${a.x + 70} ${a.y}, ${b.x + 70} ${b.y}, ${b.x} ${b.y}`;
      return `M${a.x} ${a.y} L${b.x} ${b.y}`;
    },
    batonSelector: '.pic',
    baton: () => EGG,
    onState(c) {
      document.getElementById('headline').textContent = c.headline;
      document.getElementById('hint').textContent = c.hint;
      document.getElementById('prog').textContent = c.finished ? `${c.n} / ${c.n}` : `${c.state.cur + 1} / ${c.n}`;
      const prev = c.players[c.state.cur - 1];
      const hero = document.getElementById('hero');
      const pv = document.getElementById('prev');
      const nx = document.getElementById('next');
      if (c.finished) {
        hero.innerHTML = `<div class="card" data-swap>${EGG.replace('class="egg"', 'class="egg" style="width:100%;height:100%"')}<span class="ribbon">金蛋传到了终点</span></div>`;
        pv.innerHTML = nx.innerHTML = '';
        return;
      }
      const p = c.performer;
      hero.innerHTML = `<div class="card" data-swap><div class="motion-lines"><i></i><i></i><i></i><i></i></div>${card(p)}<span class="ribbon">${p.me ? '你' : p.name} 表演中</span></div>`;
      pv.innerHTML = prev
        ? `<div class="mini">${card(prev)}</div><div class="who">${prev.me ? '你' : prev.name}</div><div class="what">刚演完</div>`
        : `<div class="mini" style="display:grid;place-items:center;font:700 44px var(--serif)">案</div><div class="who">案情卡</div><div class="what">头鹅照卡起演</div>`;
      nx.innerHTML = c.watcher
        ? `<div class="eyes">👀</div><div class="mini">${card(c.watcher)}</div><div class="who">${c.watcher.me ? '你' : c.watcher.name}</div><div class="what">正在看</div>`
        : `<div class="mini gap"></div><div class="who">末棒</div><div class="what">演完进讨论</div>`;
    },
  };
</script>
<script src="_shared.js"></script>
</body>
</html>
