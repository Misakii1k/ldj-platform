<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>谁是狱警 · 方向 B · 审讯室证词板</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* 方向 B：浅色粗墨边（现状加强版）。世界 = 审讯室；中央一块软木证词板，前几问的便签钉在上方、YES 用红图钉；当前题是板中央一张大卡；头顶一盏吊灯把板照亮，四角压暗。席位左右两排。 */
  :root {
    --card: #fffdf7;
    --accent: #7960a5;
    --cork: #d6a86a;
  }
  .device {
    background:
      radial-gradient(ellipse 42% 58% at 50% 46%, rgba(255,248,220,.9), transparent 75%),
      radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(41,39,34,.28)),
      #e7dcc6;
  }
  .lamp { position: absolute; left: 50%; top: 0; translate: -50% 0; width: 4px; height: 26px; background: var(--ink); }
  .lamp::after { content: ""; position: absolute; left: 50%; top: 24px; translate: -50% 0; width: 120px; height: 34px; background: #3b3a36; border: 3px solid var(--ink); border-radius: 60px 60px 8px 8px; box-shadow: 0 18px 40px rgba(255,236,170,.9); }

  .head { position: absolute; left: 32px; top: 24px; }
  .head .title { display: inline-block; font-size: 36px; padding: 6px 18px 8px; background: var(--card); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 5px 0 var(--ink); rotate: -2deg; }
  .head .eyebrow { margin: 10px 0 0 6px; color: var(--muted); }
  .ring-box { position: absolute; right: 32px; top: 22px; }
  .ring { width: 72px; height: 72px; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); --ring-bg: #eee3ce; }
  .ring > span { font-size: 18px; }

  .col { position: absolute; top: 132px; display: grid; gap: 12px; width: 240px; }
  .col.left { left: 32px; }
  .col.right { right: 32px; }
  .seat { grid-template-columns: 44px 1fr auto; }
  .seat .yes { grid-row: span 2; display: flex; gap: 4px; }
  .yes i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--card); }
  .yes i.used { background: var(--coral); }
  .seat.hot { background: #ffe9e2; }
  .inmate { display: none; }
  .seat.me { outline: 4px solid var(--yellow); outline-offset: 3px; }
  .seat.asker .st { color: var(--accent); }
  .seat.said-yes { transform: translateY(-3px); box-shadow: 0 6px 0 var(--coral); border-color: var(--coral); }
  .seat.said-yes .st { color: var(--coral); font-weight: 900; }

  /* 证词板 */
  .board {
    position: absolute; left: 298px; right: 298px; top: 92px; bottom: 124px; padding: 18px 20px 20px;
    background: radial-gradient(circle at 20% 30%, rgba(0,0,0,.05) 1px, transparent 2px) 0 0 / 9px 9px, var(--cork);
    border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 7px 0 var(--ink), inset 0 0 0 8px #b98246;
    display: grid; grid-template-rows: auto 1fr auto; gap: 14px;
  }
  .pins { display: flex; gap: 12px; }
  .note {
    flex: 1; min-width: 0; position: relative; padding: 14px 12px 10px; background: #fff7c9; border: 2.5px solid var(--ink); border-radius: 4px;
    box-shadow: 0 3px 0 var(--ink); font-size: 12px; font-weight: 700; line-height: 1.4; rotate: -1.5deg;
    display: grid; gap: 6px;
  }
  .note:nth-child(2n) { rotate: 1.8deg; background: #e6ddef; }
  .note:nth-child(3n) { background: #d9f0e3; }
  .note::before { content: ""; position: absolute; left: 50%; top: -9px; translate: -50% 0; width: 16px; height: 16px; border-radius: 50%; background: #3b3a36; border: 2.5px solid var(--ink); }
  .note-no { font: 700 16px var(--serif); color: var(--accent); }
  .note-yes { display: flex; gap: 4px; flex-wrap: wrap; }
  .note-yes i { width: 14px; height: 14px; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--seat-c); }
  .note-yes em { font-style: normal; color: var(--muted); }
  .note-slot { flex: 1; border: 2.5px dashed rgba(41,39,34,.35); border-radius: 4px; display: grid; place-items: center; font: 800 12px var(--sans); color: rgba(41,39,34,.45); }

  .qcard {
    align-self: center; justify-self: center; width: min(560px, 100%); padding: 22px 28px 20px; text-align: center;
    background: var(--card); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 var(--ink); position: relative;
  }
  .qcard::before { content: ""; position: absolute; left: 50%; top: -12px; translate: -50% 0; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); }
  .qcard .by { font: 800 12px var(--sans); letter-spacing: .14em; color: var(--muted); }
  .qcard .by b { color: var(--accent); }
  .q { font-family: var(--serif); font-size: 30px; line-height: 1.4; margin: 8px 0 14px; }
  .answers { display: flex; gap: 10px; justify-content: center; }
  .chip { width: 66px; height: 80px; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 6px 4px; border: 2.5px dashed rgba(41,39,34,.4); border-radius: 10px; color: var(--muted); }
  .chip.in { border: 2.5px solid var(--ink); background: repeating-linear-gradient(45deg, var(--seat-c) 0 6px, #fffdf7 6px 12px); box-shadow: 0 3px 0 var(--ink); }
  .chip-face { font: 700 22px var(--serif); }
  .chip-name { font-size: 11px; font-weight: 800; color: var(--ink); max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.flip { animation: flip 460ms cubic-bezier(.22,1,.36,1) both; }
  .chip.flip.yes { background: var(--coral); color: #fff; }
  .chip.flip.yes .chip-name { color: #fff; }
  .chip.flip.no { background: var(--card); color: var(--ink); }
  @keyframes flip { 0% { transform: rotateY(90deg) scale(1.2); } 100% { transform: none; } }
  .pin-fly { width: 20px; height: 20px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ink); }
  .board-foot { display: flex; align-items: center; gap: 12px; font: 800 13px var(--sans); }
  .board-foot .numeral { font-size: 26px; }
  .board-foot .rule { margin-left: auto; font-weight: 700; color: #4a3a22; }

  .dock {
    position: absolute; left: 32px; right: 32px; bottom: 20px; display: flex; align-items: center; gap: 14px;
    padding: 12px 14px 12px 16px; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  }
  .dock .info { flex: 1; min-width: 0; }
  .dock .info strong { display: block; font-size: 17px; }
  .dock .info span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .secret { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: #e6ddef; border: 3px solid var(--ink); border-radius: 12px; rotate: -1.5deg; }
  .secret .tag { font: 900 12px var(--sans); color: #4e3777; }
  .secret .word { font: 700 22px var(--serif); }
  .secret small { display: block; font-size: 11px; color: var(--muted); }
  .btn-yes { background: var(--coral); color: #fff; }

  @container (max-width: 600px) {
    .lamp { display: none; }
    .head { left: 14px; top: 14px; }
    .head .title { font-size: 22px; padding: 4px 12px 6px; }
    .head .eyebrow { font-size: 10px; margin-top: 6px; }
    .ring-box { right: 14px; top: 14px; }
    .ring { width: 56px; height: 56px; }
    .ring > span { font-size: 13px; }
    .col { width: auto; left: 12px !important; right: 12px !important; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .col.left { top: 94px; }
    .col.right { top: auto; bottom: 168px; }
    .seat { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 8px 4px 6px; gap: 2px; border-width: 2.5px; }
    .seat .av { width: 30px; grid-row: auto; }
    .seat .nm { font-size: 12px; max-width: 100%; }
    .seat .nm .you { display: none; }
    .seat .st { font-size: 10px; }
    .seat .yes { grid-row: auto; }
    .yes i { width: 10px; height: 10px; border-width: 2px; }
    .seat .no { width: 18px; height: 18px; font-size: 10px; left: -6px; top: -6px; }
    .board { left: 10px; right: 10px; top: 208px; bottom: 282px; padding: 14px 10px 10px; gap: 8px; box-shadow: 0 5px 0 var(--ink), inset 0 0 0 5px #b98246; }
    .pins { gap: 6px; }
    .note { padding: 10px 6px 6px; font-size: 10px; gap: 3px; }
    .note-q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-slot { font-size: 10px; }
    .note-yes i { width: 10px; height: 10px; }
    .qcard { padding: 12px 10px 10px; }
    .q { font-size: 18px; margin: 4px 0 8px; }
    .answers { gap: 4px; }
    .chip { width: 50px; height: 58px; padding: 3px 2px; }
    .chip-face { font-size: 16px; }
    .chip-name { font-size: 9px; max-width: 46px; }
    .board-foot .rule { display: none; }
    .board-foot .numeral { font-size: 18px; }
    .dock { left: 12px; right: 12px; bottom: 14px; flex-wrap: wrap; gap: 10px; padding: 12px; }
    .dock .info { flex: 1 1 150px; min-width: 0; }
    .dock .secret { flex: 0 0 auto; }
    .secret { padding: 6px 10px; }
    .secret small { display: none; }
    .dock .info strong { font-size: 15px; }
    .dock .info span { font-size: 12px; }
    .secret .word { font-size: 17px; }
    .dock .btn { flex: 1 1 calc(50% - 5px); min-height: 44px; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <strong>方向 B · 审讯室证词板（浅色粗墨边，现状加强版）</strong>
  <span class="tb-note">构图：左右两排席位 + 中央软木证词板（上排便签 = 前几问，中央大卡 = 当前题）+ 吊灯暗角　对标：狼人杀左右席位 · 榴莲的纸感</span>
  <div class="group"><button data-set-size="desktop" aria-pressed="true">桌面 1280×800</button><button data-set-size="mobile" aria-pressed="false">手机 390×844</button></div>
  <div class="group"><button data-set-count="5">5 人</button><button data-set-count="6">6 人</button></div>
  <div class="group"><button id="act-hurry">跳到最后 10 秒</button><button id="reset">重播</button></div>
</div>
<div class="stage-wrap"><div class="device" data-size="desktop">
  <div class="lamp"></div>
  <div class="head">
    <h1 class="title">谁是狱警？</h1>
    <div class="eyebrow">第 <span data-bind="qi"></span> / <span data-bind="limit"></span> 问 · 审讯中</div>
  </div>
  <div class="ring-box"><div class="ring" data-ring><span></span></div></div>

  <div class="col left" data-seats="left"></div>
  <div class="col right" data-seats="right"></div>

  <section class="board">
    <div class="pins"><div data-history style="display:contents"></div><div class="note-slot" id="slot">Q3 待钉</div><div class="note-slot">Q4</div><div class="note-slot">Q5</div></div>
    <div class="qcard">
      <div class="by">Q<span data-bind="qi"></span> · 出题人 <b data-bind="asker"></b></div>
      <p class="q" data-bind="question"></p>
      <div class="answers" data-answers></div>
    </div>
    <div class="board-foot"><span class="numeral"><span data-bind="answered"></span>/<span data-bind="total"></span></span>已作答<span class="rule">谁先用满 <span data-bind="max-yes"></span> 次 YES，立刻投票</span></div>
  </section>

  <div class="dock">
    <div class="secret" data-secret title="点击遮挡 / 显示">
      <div><div class="tag">你的罪行</div><small>点击遮挡</small></div>
      <span class="word" data-bind="crime"></span>
    </div>
    <div class="info"><strong data-bind="dock-title"></strong><span data-bind="dock-sub"></span></div>
    <button class="btn" data-answer="no">NO</button>
    <button class="btn btn-yes" data-answer="yes">YES</button>
  </div>
</div></div>
<script src="_shared.js"></script>
<script>
  document.addEventListener('pinned', () => document.getElementById('slot')?.remove());
</script>
</body>
</html>
