<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ding · A 铃在盒心</title>
<link rel="stylesheet" href="_shell.css">
<link rel="stylesheet" href="_uno.css">
<link rel="stylesheet" href="_ding.css">
<style>
  /* ── 与 UNO 同款纸盒，换深绿主色；铃放在中央大格正中，牌堆与弃牌分列两侧，短语横幅压在铃上方 ── */
  .device { background: var(--ding-soft); }
  .device::before {
    content: "Ding!"; position: absolute; right: -60px; top: -40px; width: 300px; height: 200px; rotate: 18deg;
    display: grid; place-items: center; font: 900 76px/1 var(--serif); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
    background: var(--ding); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 8px 0 var(--ink);
  }
  .box {
    position: absolute; left: 50%; top: 22px; translate: -50% 0; width: 1040px; height: 520px;
    border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 var(--ink), inset 0 0 0 10px var(--kraft-dark);
    padding: 18px; display: grid; grid-template-columns: 220px 1fr 220px; grid-template-rows: 1fr 1fr; gap: 14px;
  }
  .cell { border: 4px solid var(--ink); border-radius: 16px; background: rgba(255,253,247,.55); box-shadow: inset 0 6px 0 rgba(41,39,34,.18); display: grid; place-items: center; align-content: center; gap: 14px; }
  .cell.center { grid-column: 2; grid-row: 1 / 3; position: relative; background: var(--ding); overflow: hidden; }
  .cell.center::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.07) 0 26px, transparent 26px 52px); }
  .cell.center::after { /* 当前颜色光晕，打在铃下方 */
    content: ""; position: absolute; left: 50%; top: 58%; width: 380px; height: 380px; translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--cur) 70%, transparent) 0 40%, transparent 70%); transition: background 300ms;
  }
  .core { position: relative; z-index: 2; display: flex; align-items: center; gap: 36px; margin-top: 60px; }
  .bell { --bell: 170px; }
  .phrase-banner { position: absolute; left: 50%; top: 26px; translate: -50% 0; z-index: 3; }
  .device.bell-open .phrase-banner { translate: -50% 0; }
  .idle-word { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font: 700 28px/1 var(--serif); color: var(--cream); z-index: 2; transition: opacity 200ms; }
  .device.bell-open .idle-word { opacity: 0; }
  .center-meta { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 12px; z-index: 3; }

  .me-zone { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; justify-items: center; gap: 12px; padding-bottom: 16px; }
  .me-tag { position: absolute; left: 40px; bottom: 26px; }

  .device[data-size="mobile"]::before { width: 180px; height: 120px; font-size: 44px; }
  .device[data-size="mobile"] .box { top: 14px; width: 370px; height: 560px; padding: 10px; gap: 8px; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; border-width: 4px; }
  .device[data-size="mobile"] .cell { border-width: 3px; border-radius: 12px; padding: 6px; gap: 6px; }
  .device[data-size="mobile"] .cell.center { grid-column: 1 / 3; grid-row: 2; }
  .device[data-size="mobile"] .cell.l1 { grid-column: 1; grid-row: 1; } .device[data-size="mobile"] .cell.r1 { grid-column: 2; grid-row: 1; }
  .device[data-size="mobile"] .cell.l2 { grid-column: 1; grid-row: 3; } .device[data-size="mobile"] .cell.r2 { grid-column: 2; grid-row: 3; }
  .device[data-size="mobile"] .cell .sticker { width: 100%; }
  .device[data-size="mobile"] .core { gap: 14px; margin-top: 40px; }
  .device[data-size="mobile"] .bell { --bell: 104px; }
  .device[data-size="mobile"] .cell.center::after { width: 240px; height: 240px; }
  .device[data-size="mobile"] .idle-word { font-size: 20px; top: 14px; }
  .device[data-size="mobile"] .phrase-banner { top: 8px; }
  .device[data-size="mobile"] .center-meta { bottom: 6px; }
  .device[data-size="mobile"] .color-chip { font-size: 13px; padding: 4px 10px 4px 4px; }
  .device[data-size="mobile"] .color-chip i { width: 20px; height: 20px; }
  .device[data-size="mobile"] .me-tag { position: static; }
  .device[data-size="mobile"] .me-zone { gap: 8px; padding-bottom: 12px; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Ding · A 铃在盒心</strong>
  <span class="note">对标：UNO 同系列（C17） ｜ 与 B 的差别：铃放在中央大格正中，牌堆和弃牌分列两侧，是全场唯一焦点；短语横幅压在铃正上方</span>
  <div class="group"><button data-set-size="desktop" aria-pressed="true">桌面 1280×800</button><button data-set-size="mobile">手机 390×844</button></div>
  <div class="group"><button id="demo-open">① 阿杰打出短语卡</button><button id="reset">重播</button><a href="index.html">返回目录</a></div>
</div>
<div class="stage-wrap"><div class="device ding" data-size="desktop">
  <div class="box kraft" data-box="box">
    <div class="cell l1">
      <div class="sticker active" data-opp="jie" style="--rot:-3deg"><div class="avatar" style="background:#f29a7a">杰</div><b>阿杰</b><span class="n">4<small>张</small></span></div>
      <div class="sticker"><div class="avatar" style="background:#8fd3b6">可</div><b>可可</b><span class="n">6<small>张</small></span></div>
    </div>
    <div class="cell center">
      <div class="idle-word">轮到阿杰</div>
      <div class="phrase-banner"><small>谁做了这个动作就拍铃</small><span class="text"></span></div>
      <div class="core">
        <div class="deck" data-box="deck"><div class="uc back"><span class="v">Ding</span></div></div>
        <button class="bell" aria-label="拍铃"><span class="base"></span><span class="dome"></span><span class="knob"></span>
          <span class="bell-ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" cx="50" cy="50" r="46"/></svg><span class="ring-num"></span></span></button>
        <div class="discard" data-box="discard"></div>
      </div>
      <div class="center-meta"><span class="color-chip"><i></i>当前：<span data-color-name></span></span></div>
    </div>
    <div class="cell r1"><div class="sticker" style="--rot:2deg"><div class="avatar" style="background:#b9a4e6">王</div><b>老王</b><span class="n">8<small>张</small></span></div></div>
    <div class="cell l2"><div class="sticker" style="--rot:2deg"><div class="avatar" style="background:#9cc7f0">糯</div><b>糯米</b><span class="n">5<small>张</small></span></div></div>
    <div class="cell r2"><div class="sticker" style="--rot:-2deg"><div class="avatar" style="background:#f6b7cf">M</div><b>Momo</b><span class="n">7<small>张</small></span></div></div>
  </div>

  <div class="me-zone">
    <div class="sticker me-tag" data-box="me"><div class="avatar" style="background:#f7c84b">鱼</div><b>小鱼干（你）</b><span class="n"><span data-me-count>6</span><small>张</small></span></div>
    <div class="fan my-hand" data-box="hand"></div>
    <div class="dock" data-box="dock">
      <button class="btn" id="btn-draw">摸牌</button>
      <button class="btn" id="btn-ring">拍铃！</button>
    </div>
  </div>

  <div class="picker"><div class="pad"><p>选一个颜色</p><button data-pick="red" style="background:var(--red)">红</button><button data-pick="yellow" style="background:var(--yellow)">黄</button><button data-pick="green" style="background:var(--green)">绿</button><button data-pick="blue" style="background:var(--blue)">蓝</button></div></div>
  <div class="slam slam-fx"><span class="word"></span></div>
</div></div>
<script src="_ding.js"></script>
<script src="_shell.js"></script>
<script src="_uno.js"></script>
</body>
</html>
