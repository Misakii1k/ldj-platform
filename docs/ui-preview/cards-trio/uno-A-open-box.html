<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO · A 打开的游戏盒</title>
<link rel="stylesheet" href="_shell.css">
<link rel="stylesheet" href="_uno.css">
<style>
  /* ── 场景：俯视一只打开的纸板游戏盒，盒壁 + 隔层；牌堆在中央大格，对手贴在四周小格 ── */
  .device { background: #f4e9d6; }
  .device::before { /* 桌面上的盒盖，斜放在角落 */
    content: "UNO"; position: absolute; right: -60px; top: -40px; width: 300px; height: 200px; rotate: 18deg;
    display: grid; place-items: center; font: 900 90px/1 var(--serif); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
    background: var(--red); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 8px 0 var(--ink);
  }
  .box {
    position: absolute; left: 50%; top: 22px; translate: -50% 0; width: 1040px; height: 520px;
    border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 var(--ink);
    padding: 18px; display: grid; grid-template-columns: 220px 1fr 220px; grid-template-rows: 1fr 1fr; gap: 14px;
  }
  .box.kraft { box-shadow: 0 10px 0 var(--ink), inset 0 0 0 10px var(--kraft-dark); }
  .cell {
    border: 4px solid var(--ink); border-radius: 16px; background: rgba(255,253,247,.55);
    box-shadow: inset 0 6px 0 rgba(41,39,34,.18); display: grid; place-items: center; align-content: center; gap: 14px; position: relative;
  }
  .cell.center { grid-column: 2; grid-row: 1 / 3; background: var(--cream); overflow: hidden; }
  .cell.center::before { /* 当前颜色大色块，铺在中央格底 */
    content: ""; position: absolute; inset: 0; background: var(--cur); opacity: .9; transition: background 300ms;
    clip-path: circle(38% at 50% 48%);
  }
  .table-core { position: relative; display: flex; align-items: center; gap: 46px; z-index: 2; }
  .dir-ring { left: 50%; top: 48%; width: 400px; height: 400px; translate: -50% -50%; z-index: 1; }
  .center-meta { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 14px; align-items: center; z-index: 3; }
  .phase-word { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font: 700 30px/1 var(--serif); z-index: 3; }
  .cell .sticker:nth-child(2) { --rot: 3deg; }

  .me-zone { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; justify-items: center; gap: 12px; padding-bottom: 16px; }
  .me-tag { position: absolute; left: 40px; bottom: 26px; }

  /* ── 手机：盒子竖放，上方一行三格、下方一行两格放对手 ── */
  .device[data-size="mobile"]::before { width: 180px; height: 120px; font-size: 54px; right: -60px; top: -40px; }
  .device[data-size="mobile"] .box { top: 14px; width: 370px; height: 560px; padding: 10px; gap: 8px; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; border-width: 4px; }
  .device[data-size="mobile"] .cell { border-width: 3px; border-radius: 12px; padding: 6px; gap: 6px; }
  .device[data-size="mobile"] .cell.center { grid-column: 1 / 3; grid-row: 2; }
  .device[data-size="mobile"] .cell.l1 { grid-column: 1; grid-row: 1; }
  .device[data-size="mobile"] .cell.r1 { grid-column: 2; grid-row: 1; }
  .device[data-size="mobile"] .cell.l2 { grid-column: 1; grid-row: 3; }
  .device[data-size="mobile"] .cell.r2 { grid-column: 2; grid-row: 3; }
  .device[data-size="mobile"] .cell .sticker { width: 100%; }
  .device[data-size="mobile"] .table-core { gap: 26px; }
  .device[data-size="mobile"] .dir-ring { width: 270px; height: 270px; }
  .device[data-size="mobile"] .phase-word { font-size: 20px; top: 10px; }
  .device[data-size="mobile"] .center-meta { bottom: 8px; }
  .device[data-size="mobile"] .color-chip { font-size: 13px; padding: 4px 10px 4px 4px; }
  .device[data-size="mobile"] .color-chip i { width: 20px; height: 20px; }
  .device[data-size="mobile"] .turn-ring { width: 44px; height: 44px; }
  .device[data-size="mobile"] .me-tag { position: static; }
  .device[data-size="mobile"] .me-zone { gap: 8px; padding-bottom: 12px; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>UNO · A 打开的游戏盒</strong>
  <span class="note">对标：榴莲的"一屏总览" ｜ 与 B/C 的差别：俯视一只打开的纸盒，盒壁 + 隔层就是布局；对手各占一格，中央大格是牌堆和当前颜色</span>
  <div class="group"><button data-set-size="desktop" aria-pressed="true">桌面 1280×800</button><button data-set-size="mobile">手机 390×844</button></div>
  <div class="group"><button id="reset">重播</button><a href="index.html">返回目录</a></div>
</div>
<div class="stage-wrap"><div class="device" data-size="desktop">
  <div class="box kraft" data-box="box">
    <div class="cell l1">
      <div class="sticker active" style="--rot:-3deg"><div class="avatar" style="background:#f29a7a">杰</div><b>阿杰</b><span class="n">9<small>张</small></span></div>
      <div class="sticker"><div class="avatar" style="background:#8fd3b6">可</div><b>可可</b><span class="n">1<small>张</small></span></div>
    </div>
    <div class="cell center">
      <div class="phase-word">轮到你</div>
      <div class="dir-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="#292722" stroke-width="4" stroke-dasharray="14 12"/><path d="M100 4 l12 8 -12 8 z" fill="#292722"/><path d="M100 196 l-12 -8 12 -8 z" fill="#292722"/></svg></div>
      <div class="table-core">
        <div class="deck" data-box="deck"><div class="uc back"><span class="v">UNO</span></div></div>
        <div class="discard" data-box="discard"></div>
      </div>
      <div class="center-meta">
        <span class="color-chip"><i></i>当前：<span data-color-name></span></span>
        <div class="turn-ring"><svg viewBox="0 0 60 60"><circle class="track" cx="30" cy="30" r="26"/><circle class="bar" cx="30" cy="30" r="26"/></svg><span class="ring-num"></span></div>
      </div>
    </div>
    <div class="cell r1">
      <div class="sticker" style="--rot:2deg"><div class="avatar" style="background:#b9a4e6">王</div><b>老王</b><span class="n">5<small>张</small></span></div>
    </div>
    <div class="cell l2">
      <div class="sticker uno-warn" style="--rot:2deg"><div class="avatar" style="background:#9cc7f0">糯</div><b>糯米</b><span class="n">1<small>张</small></span></div>
    </div>
    <div class="cell r2">
      <div class="sticker" style="--rot:-2deg"><div class="avatar" style="background:#f6b7cf">M</div><b>Momo</b><span class="n">3<small>张</small></span></div>
    </div>
  </div>

  <div class="me-zone">
    <div class="sticker me-tag" data-box="me"><div class="avatar" style="background:#f7c84b">鱼</div><b>小鱼干（你）</b><span class="n"><span data-me-count>7</span><small>张</small></span></div>
    <div class="fan my-hand" data-box="hand"></div>
    <div class="dock" data-box="dock">
      <button class="btn" id="btn-draw">摸牌</button>
      <button class="btn btn-primary" id="btn-uno">UNO!</button>
    </div>
  </div>

  <div class="picker"><div class="pad"><p>选一个颜色</p><button data-pick="red" style="background:var(--red)">红</button><button data-pick="yellow" style="background:var(--yellow)">黄</button><button data-pick="green" style="background:var(--green)">绿</button><button data-pick="blue" style="background:var(--blue)">蓝</button></div></div>
  <div class="slam slam-fx"><span class="word"></span></div>
</div></div>
<script src="_uno-data.js"></script>
<script src="_shell.js"></script>
<script src="_uno.js"></script>
<script>Preview.countdown(document.querySelector('.turn-ring'), 15);</script>
</body>
</html>
